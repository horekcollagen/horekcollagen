<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HOREK – Scrap Society</title>
<meta name="description" content="Virtueller Rundgang durch drei Räume mit Collagen von HOREK in Originalgröße.">
<style>
  :root{ --ink:#f3efe7; --muted:#b4ac9d; --line:#3a352d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#111;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  #cover{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px 20px;background:radial-gradient(120% 90% at 50% 30%,#1c1a16 0%,#0c0b0a 100%);
    transition:opacity .8s ease}
  #cover.hide{opacity:0;pointer-events:none}
  .brand{font-size:clamp(26px,6vw,46px);font-weight:700;margin:0 0 .5em}
  .lead{max-width:42ch;font-size:clamp(15px,2.4vw,18px);line-height:1.5;color:#e7e1d6;margin:0 auto}
  .lead .sub{display:block;color:var(--muted);margin-top:.8em;font-size:.95em}
  #enter{margin-top:30px;padding:14px 30px;font-size:16px;font-weight:600;color:#121110;background:#efe9dd;border:0;border-radius:2px;cursor:pointer;transition:transform .15s,background .2s,opacity .2s}
  #enter:hover{background:#fff;transform:translateY(-1px)}
  #enter[disabled]{opacity:.45;cursor:default;transform:none}
  #bar{margin-top:22px;width:min(240px,60vw);height:2px;background:#36312a;overflow:hidden}
  #bar>i{display:block;height:100%;width:0;background:#c9bfaa;transition:width .25s}
  #barLbl{margin-top:9px;font-size:12px;color:var(--muted);min-height:1em}

  #hint{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:20;background:rgba(16,14,12,.72);
    color:#e9e3d7;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap;
    max-width:94vw;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none;transition:opacity .6s}
  #hint.show{opacity:1}

  #rooms{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:21;display:none;gap:7px}
  #rooms.show{display:flex}
  #rooms button{min-width:40px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(18,16,14,.8);
    color:#cfc8bb;font-size:13px;font-weight:600;cursor:pointer}
  #rooms button.on{background:#efe9dd;color:#1a1714;border-color:#efe9dd}

  #foot{position:fixed;left:12px;bottom:12px;z-index:20;font-size:12px;color:#9a9284;display:flex;gap:8px;align-items:center}
  #foot a{color:#b9b1a2;text-decoration:none;border-bottom:1px solid transparent}
  #foot a:hover{color:#efe9dd;border-bottom-color:#6f685c}
  #foot span{opacity:.5}

  #panel{position:fixed;z-index:25;right:0;top:0;height:100%;width:min(360px,86vw);background:rgba(18,16,14,.94);
    border-left:1px solid var(--line);padding:40px 26px;display:flex;flex-direction:column;gap:14px;
    transform:translateX(102%);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  #panel.open{transform:translateX(0)}
  #panel .ptitle{font-size:22px;font-weight:700;line-height:1.25;margin:0}
  #panel .pmeta{color:var(--muted);font-size:15px}
  #panel .pdim{font-size:16px;color:#e7e1d6;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
  #panel .pbtns{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  #panel .btn{display:block;text-align:center;padding:13px 16px;border-radius:2px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--line)}
  #panel .ask{background:#efe9dd;color:#121110;border-color:#efe9dd}
  #panel .back{background:transparent;color:#e7e1d6}
  #panel .back:hover{background:#221f1a}
  @media (max-width:560px){
    #panel{width:100%;border-left:0;padding:28px 20px calc(20px + env(safe-area-inset-bottom))}
    #hint{bottom:70px;white-space:normal;text-align:center;max-width:90vw;line-height:1.35;border-radius:14px}
  }
</style>
</head>
<body>
<div id="app"></div>

<aside id="panel" aria-hidden="true">
  <h2 class="ptitle"></h2>
  <div class="pmeta">Collage auf Holz, Unikat</div>
  <div class="pdim"></div>
  <div class="pbtns">
    <a class="btn ask" id="askBtn" href="#">Anfragen</a>
    <button class="btn back" id="backBtn" type="button">Zurück in den Raum</button>
  </div>
</aside>

<div id="hint"></div>
<nav id="rooms" aria-label="Räume">
  <button data-room="1" type="button">1 · Kabinett</button>
  <button data-room="2" type="button">2 · Mittelraum</button>
  <button data-room="3" type="button">3 · Saal</button>
</nav>

<footer id="foot">
  <a href="https://horekcollagen.de" target="_blank" rel="noopener">horekcollagen.de</a><span>·</span>
  <a href="https://horekcollagen.de/impressum" target="_blank" rel="noopener">Impressum</a><span>·</span>
  <a href="https://horekcollagen.de/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
</footer>

<div id="cover">
  <h1 class="brand">HOREK – Scrap Society</h1>
  <p class="lead">
    Drei Räume. <span id="countTxt">…</span> Collagen in Originalgröße.
    <span class="sub">Das Foto zeigt die Oberfläche. Papier, Schichten und Holz entfalten ihre Wirkung im Original.</span>
  </p>
  <button id="enter" disabled>Raum betreten</button>
  <div id="bar"><i></i></div>
  <div id="barLbl">Räume werden geladen …</div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
